name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Biome CI
        run: npm run ci

      - name: Astro type check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build:static

      - name: Upload dist for SFTP
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist
          retention-days: 1
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-sftp:
    # Repository variable, not a secret: `secrets` is unavailable in job-level
    # `if`. Unset (forks, fresh clones) => job is skipped, not failed.
    if: ${{ vars.SFTP_HOST != '' }}
    environment:
      name: sftp
      url: https://www.tv-odernheim.de
    runs-on: ubuntu-latest
    # sshpass waits for the password prompt without a timeout of its own, so
    # bound the job in case the server ever stops prompting the way it does now.
    timeout-minutes: 20
    needs: build
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install lftp and sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp sshpass

      - name: Pin host key
        env:
          SFTP_KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS }}
        run: |
          [ -n "$SFTP_KNOWN_HOSTS" ] || { echo "::error::variable SFTP_KNOWN_HOSTS is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts   # fails fast on a malformed pin, logs the fingerprint

      - name: Mirror dist to server
        env:
          SFTP_HOST: ${{ vars.SFTP_HOST }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_USER: ${{ vars.SFTP_USER }}
          SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}
          # read by sshpass -e; never on a command line, where ps would show it
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          [ -n "$SSHPASS" ] || { echo "::error::secret SFTP_PASSWORD is not set"; exit 1; }
          remote="${SFTP_REMOTE_DIR:-.}"
          remote="${remote%/}"; [ -n "$remote" ] || remote=/

          # The host only offers password authentication, so ssh is driven by
          # sshpass. BatchMode must stay off (it disables password auth), but
          # the server is still verified against the pinned host key and no
          # local identity is offered: StrictHostKeyChecking=yes plus
          # PubkeyAuthentication=no. NumberOfPasswordPrompts=1 turns a wrong
          # password into an immediate failure instead of three prompts.
          ssh_cmd="sshpass -e ssh -a -x -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15"

          # lftp's --exclude keeps a remote .htaccess only inside directories
          # that also exist locally: a directory missing from dist/ is removed
          # recursively by --delete, excluded files included. So list the remote
          # .htaccess files first and re-create their directories (empty) in the
          # local tree; mirror then descends into them and deletes only their
          # non-excluded contents. Failure here (e.g. remote dir does not exist
          # yet on a first deploy) is non-fatal; the mirror below is the gate.
          remote_list="$(mktemp)"
          lftp -u "$SFTP_USER," "sftp://$SFTP_HOST:${SFTP_PORT:-22}" > "$remote_list" <<EOF || echo "note: remote listing failed, nothing to protect"
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:timeout 30
          set sftp:connect-program "$ssh_cmd"
          cd "$remote"
          find .
          bye
          EOF
          while IFS= read -r path; do
            case "$path" in
              ./*/.htaccess)
                dir="${path#./}"; dir="${dir%/.htaccess}"
                echo "keeping remote .htaccess in $dir"
                mkdir -p "dist/$dir"
                ;;
            esac
          done < "$remote_list"
          rm -f "$remote_list"

          lftp -u "$SFTP_USER," "sftp://$SFTP_HOST:${SFTP_PORT:-22}" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:timeout 30
          set sftp:connect-program "$ssh_cmd"
          mirror --reverse --delete --no-perms --parallel=4 --verbose --exclude '(^|/)\.htaccess$' dist "$remote"
          bye
          EOF
